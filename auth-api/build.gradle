plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

// Java toolchain is configured in the root project's subprojects block

dependencies {
    implementation project(":auth-data")
    implementation project(":auth-client")

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Authorization Server compatible with Spring Boot 3.3.x
    implementation 'org.springframework.security:spring-security-oauth2-authorization-server:1.3.1'

    // Database driver (artifact renamed in modern versions)
    implementation 'com.mysql:mysql-connector-j'

    // Utilities
    implementation 'org.modelmapper:modelmapper:3.2.0'
    implementation 'org.sqids:sqids:0.1.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
