spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://172.17.0.2:3306/auth
spring.datasource.username=root
spring.datasource.password=test_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.platform=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-consent-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/client/oauth2-registered-client-schema.sql
logging.level.root=info
logging.level.org.springframework.web=info
management.endpoints.web.exposure.include=mappings
# logging.level.org.hibernate=debug

# Outbound mail configuration (use personal email SMTP credentials via environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notification.email.enabled=false
notification.email.from-address=${MAIL_FROM_ADDRESS:your.email@example.com}
notification.email.subject=Albedo Auth Password Reset
notification.email.reset-url=${PASSWORD_RESET_URL:https://auth.example.com/reset?token=}

notification.sms.enabled=false

app.auth.issuer=${APP_AUTH_ISSUER:http://localhost:8080}
app.auth.client-id=${APP_AUTH_CLIENT_ID:albedo-client}
app.auth.client-secret=${APP_AUTH_CLIENT_SECRET:albedo-secret}
app.auth.client-scopes=${APP_AUTH_CLIENT_SCOPES:openid,profile,read,write}
app.auth.client-redirect-uri=${APP_AUTH_CLIENT_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/albedo-client}
app.auth.access-token-ttl=${APP_AUTH_ACCESS_TOKEN_TTL:PT1H}
app.auth.refresh-token-ttl=${APP_AUTH_REFRESH_TOKEN_TTL:PT12H}
