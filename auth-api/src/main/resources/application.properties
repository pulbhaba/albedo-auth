spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/auth
spring.datasource.username=root
spring.datasource.password=test_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=never
spring.sql.init.platform=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-consent-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/client/oauth2-registered-client-schema.sql
logging.level.root=info
logging.level.org.springframework.web=info
management.endpoints.web.exposure.include=mappings
# logging.level.org.hibernate=debug
# Outbound mail configuration (use personal email SMTP credentials via environment variables)
#spring.mail.host=${MAIL_HOST:smtp.gmail.com}
#spring.mail.port=${MAIL_PORT:587}
#spring.mail.username=${MAIL_USERNAME:}
#spring.mail.password=${MAIL_PASSWORD:}
#spring.mail.properties.mail.smtp.auth=false
#spring.mail.properties.mail.smtp.starttls.enable=false

# Notification Configuration
notification.active-provider=logging
# Available providers: logging, email, sms

# Notification Provider Type Settings
# If email is selected as active-provider, choose the sub-provider
notification.email.provider=smtp
# Available email providers: smtp, ses, sendgrid

# If sms is selected as active-provider, choose the sub-provider
notification.sms.provider=sns
# Available sms providers: sns

# Common Notification Settings
notification.frontend-url=${FRONTEND_URL:https://example.com}
notification.email.from-address=${MAIL_FROM_ADDRESS:your.email@example.com}
notification.email.subject=Albedo Auth Password Reset
notification.email.body-template=Hello %s,%n%nYou requested to reset your password. Use the following link to proceed:%n%s%n%nIf you did not request this change, please ignore this email.%n

# SMTP Provider Settings
notification.email.smtp.enabled=false

# SendGrid Provider Settings
notification.email.sendgrid.api-key=${SENDGRID_API_KEY:}

# AWS Provider Settings
notification.aws.region=${AWS_REGION:us-east-1}
notification.aws.access-key=${AWS_ACCESS_KEY:}
notification.aws.secret-key=${AWS_SECRET_KEY:}

# AWS SES Email Settings
notification.email.ses.enabled=false

# AWS SNS SMS Settings
notification.sms.sns.enabled=false
app.auth.issuer=${APP_AUTH_ISSUER:http://localhost:8080}
app.auth.client-id=${APP_AUTH_CLIENT_ID:albedo-client}
app.auth.client-secret=${APP_AUTH_CLIENT_SECRET:albedo-secret}
app.auth.client-scopes=${APP_AUTH_CLIENT_SCOPES:openid,profile,read,write}
app.auth.client-redirect-uri=${APP_AUTH_CLIENT_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/albedo-client}
app.auth.access-token-ttl=${APP_AUTH_ACCESS_TOKEN_TTL:PT1H}
app.auth.refresh-token-ttl=${APP_AUTH_REFRESH_TOKEN_TTL:PT12H}

# Social Login (Federated Identity) Configuration
app.auth.social-login.enabled=true
app.auth.social-login.providers.google.enabled=true
app.auth.social-login.providers.facebook.enabled=true
app.auth.social-login.providers.github.enabled=true
app.auth.social-login.providers.microsoft.enabled=true

# Replace these with actual values from provider consoles
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:your-microsoft-client-id}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:your-microsoft-client-secret}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
