spring.main.allow-bean-definition-overriding=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.platform=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true
# Use the same schema scripts as production to initialize OAuth tables
spring.sql.init.schema-locations=classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/oauth2-authorization-consent-schema.sql,classpath:org/springframework/security/oauth2/server/authorization/client/oauth2-registered-client-schema.sql
# Logging
logging.level.root=warn
# App/OAuth properties for tests
app.auth.issuer=http://localhost:8080
app.auth.client-id=test-client
app.auth.client-secret=test-secret
app.auth.client-scopes=openid,profile,read,write
app.auth.client-redirect-uri=http://127.0.0.1:8080/login/oauth2/code/test-client
app.auth.access-token-ttl=PT1H
app.auth.refresh-token-ttl=PT12H
app.auth.password-reset-token-ttl=PT15M
# JWT signing key for JWK endpoint
spring.security.oauth2.resource-owner.jwt.signing-key=test-signing-key-1234567890
spring.security.client.secret=enc-secret
spring.security.client.salt=enc-salt
app.auth.social-login.enabled=true
app.auth.social-login.providers.google.enabled=true