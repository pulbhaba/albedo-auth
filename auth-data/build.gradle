plugins {
    id 'java-library'
}

// Java toolchain is configured in the root project's subprojects block

dependencies {
    implementation project(":auth-client")
    api 'org.springframework.boot:spring-boot-starter-security:3.3.5'
    api 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.5'
    api 'org.springframework.data:spring-data-envers:3.3.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.5'
}

tasks.named('test') {
    useJUnitPlatform()
}
